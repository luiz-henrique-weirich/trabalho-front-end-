<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <form action="index5.html" method="post">
        <label for="nomeCompleto">Nome Completo</label>
        <input type="text" id="nomeCompleto" name="nomeCompleto">
        <label> Email
            <input type="email" name="emailDoUsuário">
        </label">
        <label for="dataNascimento">Data de Nascimento</label>
        <input type="date" id="dataNascimento" name="dataNascimento">
        <label for="idade">idade</label>
        <input type="number" id="idade" name="idade">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha">
        <label for="cuirriculo">Curriculo</label>
        <input type="file" id="curriculo" name="curriculo" accept=".pdf">
        <label for="range">Range</label>
        <input type="range" min="0" max="10" step="2" id="range" name="range">
        <br>
        <!--Checkbox-->
        <p>Quais tecnologias você conhece</p>
        <label><input type="checkbox" name="tecnologia" value="html">HTML 
        </label>
        <label>
            <input type="checkbox" name="tecnologia" value="css">CSS
        </label>
        <label>
        <input type="checkbox" name="tecnologia" value="js">JAVASCRIPT
        </label>
        <p>Qaul é seu turno de estudo?</p>
        <label>
            <input type="radio" name="turno" value="manhã">MANHÃ
        </label>
        <label>
            <input type="radio" name="turno" value="tarde">TARDE
        </label>
        <label>
            <input type="radio" name="turno" value="noite">NOITE
        </label>
        <label for="curso">Curso</label>
        <select if="curso" name="curso">
            <option value="">Selecione...</option>
            <option value="informatica">Informatica</option>
            <optgroup label="Gestão">
                <option value="adm">Administração</option>        
                <option value="contabeis">Ciências contabeis</option>        
            </optgroup>
        </select>
        <label for="cidade"></label>
        <input list="cidades" id="cidade" name="cidade">
        <datalist id="cidades">
            <option value="Chapecó">
            <option value="Joinvile">
            <option value="Florianópolis">
        </datalist>

        <button type="submit">Enviar</button>
    </form>
    
</body>
</html>
