<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <table>
        <caption>Horários das aulas da semana</caption> <!--Titulo da Tabela-->
        <thead> <!--Cabeçalho da Tabela-->
            <tr> <!--Linha da Tabela--> 
                <th scope="col">Dia da Semana</th>
                <th scope="col">Unidade Curricular</th>
                <th scope="col">Horário</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Segunda-feira</td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td>Terça-feira</td>
                <td>Codificação Front-End</td>
                <td>14:00 às 17:00</td>
            </tr>
        </tbody>
        <tfoot> <!--Rodapé da Tabela-->
            <tr>
                <td colspan="3">Itervalo: 15:15 às 15:30</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
